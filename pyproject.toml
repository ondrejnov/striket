[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "striket"
version = "0.1.0"
description = "Thin, adapter-agnostic orchestrator over agentiscode for authorized security testing — Strix know-how without the Strix agent engine."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Striket contributors" }]
keywords = ["security", "pentest", "sast", "sarif", "agentiscode", "authorized-testing"]

dependencies = [
  "jsonschema>=4.21",
  "textual>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
striket = "orchestrator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator"]

# These trees are loaded at runtime but are not Python packages, so a plain
# install would drop them. Force-include them inside the installed package as
# orchestrator/_bundle/... ; orchestrator.resources resolves them from there
# when the repo-root copy is absent (see that module). mcp/ is deliberately
# nested under _bundle so it never shadows the third-party ``mcp`` SDK.
[tool.hatch.build.targets.wheel.force-include]
"schemas" = "orchestrator/_bundle/schemas"
"harness" = "orchestrator/_bundle/harness"
"mcp" = "orchestrator/_bundle/mcp"

[tool.hatch.build.targets.sdist]
include = ["orchestrator", "schemas", "harness", "mcp", "README.md"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
